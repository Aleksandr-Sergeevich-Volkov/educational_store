<div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="mb-0 text-primary">
        <i class="bi bi-star-fill me-1"></i>Архив статей
    </h6>
    <div class="d-flex align-items-center gap-1">
        <button class="btn btn-outline-primary btn-sm"
                hx-get="{% url 'homepage:useful_posts' %}"
                hx-target="#posts-container"
                hx-swap="innerHTML"
                hx-indicator="#posts-spinner">
            📖 Полезные статьи
            <span class="badge bg-primary ms-1">{{ useful_count }}</span>
        </button>
        <span id="posts-spinner" class="htmx-indicator spinner-border spinner-border-sm text-secondary"></span>
    </div>
</div>

{% for post in archive %}
    {% include 'includes/post_comments.html' with post=post archive=True %}
{% empty %}
    <div class="alert alert-info">
        <i class="bi bi-info-circle me-1"></i>
        Архив пуст.
    </div>
{% endfor %}
