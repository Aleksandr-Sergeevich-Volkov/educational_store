<div class="d-flex justify-content-between align-items-center mb-3">
    <h6 class="mb-0 text-primary">
        <i class="bi bi-star-fill me-1"></i>Полезные статьи
    </h6>
    <div class="d-flex align-items-center gap-1">
        <button class="btn btn-outline-secondary btn-sm"
                hx-get="{% url 'homepage:archive_posts' %}"
                hx-target="#posts-container"
                hx-swap="innerHTML"
                hx-indicator="#posts-spinner">
            📚 Архив статей
            <span class="badge bg-secondary ms-1">{{ archive_count }}</span>
        </button>
        <span id="posts-spinner" class="htmx-indicator spinner-border spinner-border-sm text-secondary"></span>
    </div>
</div>

{% for post in text %}
    {% include 'includes/post_comments.html' with post=post archive=False %}
{% empty %}
    <div class="alert alert-info">
        <i class="bi bi-info-circle me-1"></i>
        Пока нет статей. Загляните позже!
    </div>
{% endfor %}
