{% load static %}
<div class="mb-3" id="{% if archive %}archive-{% endif %}post-{{ post.id }}">
    <p class="h5 mb-2">{{ post.title }}</p>          
    
    <!-- ===== ТЕКСТ С ВОЗМОЖНОСТЬЮ РАСКРЫТИЯ ===== -->
    <div class="post-content" id="post-content-{{ post.id }}">
        <!-- Короткая версия (видна по умолчанию) -->
        <div class="card-text mb-2" id="short-text-{{ post.id }}">
            {{ post.text|truncatewords:25|safe|linebreaks }}
            {% if post.text|wordcount > 25 %}
                <span class="text-primary expand-trigger" 
                      style="cursor: pointer;" 
                      data-post-id="{{ post.id }}">
                </span>
            {% endif %}
        </div>
        
        <!-- Полная версия (скрыта) -->
        <div class="card-text mb-2" id="full-text-{{ post.id }}" style="display: none;">
            {{ post.text|safe|linebreaks }}
        </div>
    </div>
    
    <!-- ===== КОММЕНТАРИИ (СКРЫТЫ ПО УМОЛЧАНИЮ) ===== -->
<div id="comments-container-{{ post.id }}"></div>
    
    <!-- ===== КНОПКИ ВНИЗУ ===== -->
    <div class="d-flex gap-1 mt-3">
        <button class="btn btn-outline-primary btn-sm flex-fill expand-btn" 
                data-post-id="{{ post.id }}"
                style="white-space: nowrap; border-radius: 20px;">
            📖 Читать полностью текст 👁️ <span class="views-count" id="views-count-{{ post.id }}">{{ post.views }}</span>
        </button>
        
        <button class="btn btn-outline-secondary btn-sm flex-fill"
        hx-get="{% url 'homepage:post_comments' post.id %}"
        hx-target="#comments-container-{{ post.id }}"
        hx-swap="innerHTML"
        hx-indicator="#comments-spinner-{{ post.id }}"
        style="white-space: nowrap; border-radius: 20px;">
    💬 Комментарии ({{ post.comment_count }})
</button>
<span id="comments-spinner-{{ post.id }}"
      class="htmx-indicator spinner-border spinner-border-sm text-secondary ms-1"></span>
    </div>
</div>
